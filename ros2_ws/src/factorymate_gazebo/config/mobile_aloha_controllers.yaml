mobile_aloha:
  controller_manager:
    ros__parameters:
      update_rate: 50
      use_sim_time: true
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      arm_position_controller:
        type: position_controllers/JointGroupPositionController

  arm_position_controller:
    ros__parameters:
      interface_name: position
      joints:
        - fl_joint1
        - fl_joint2
        - fl_joint3
        - fl_joint4
        - fl_joint5
        - fl_joint6
        - fl_joint7
        - fl_joint8
        - fr_joint1
        - fr_joint2
        - fr_joint3
        - fr_joint4
        - fr_joint5
        - fr_joint6
        - fr_joint7
        - fr_joint8
        - bl_joint1
        - bl_joint2
        - bl_joint3
        - bl_joint4
        - bl_joint5
        - bl_joint6
        - bl_joint7
        - bl_joint8
        - br_joint1
        - br_joint2
        - br_joint3
        - br_joint4
        - br_joint5
        - br_joint6
        - br_joint7
        - br_joint8
        - mid_camera_stand_joint
