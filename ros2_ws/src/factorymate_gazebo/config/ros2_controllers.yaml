factorymate:
  controller_manager:
    ros__parameters:
      update_rate: 50
      use_sim_time: true
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      diff_drive_controller:
        type: diff_drive_controller/DiffDriveController

  diff_drive_controller:
    ros__parameters:
      left_wheel_names: ["left_wheel_joint"]
      right_wheel_names: ["right_wheel_joint"]
      wheel_separation: 0.64
      wheel_radius: 0.15
      odom_frame_id: odom
      base_frame_id: base_link
      enable_odom_tf: true
      tf_frame_prefix_enable: false
      publish_rate: 50.0
      position_feedback: true
      open_loop: false
      use_stamped_vel: true
      cmd_vel_timeout: 0.5
      publish_limited_velocity: true
      velocity_rolling_window_size: 10
      linear.x.has_velocity_limits: true
      linear.x.has_acceleration_limits: true
      linear.x.has_jerk_limits: true
      linear.x.max_velocity: 0.72
      linear.x.min_velocity: -0.72
      linear.x.max_acceleration: 0.65
      linear.x.max_jerk: 1.80
      angular.z.has_velocity_limits: true
      angular.z.has_acceleration_limits: true
      angular.z.has_jerk_limits: true
      angular.z.max_velocity: 1.30
      angular.z.min_velocity: -1.30
      angular.z.max_acceleration: 2.00
      angular.z.max_jerk: 5.00
